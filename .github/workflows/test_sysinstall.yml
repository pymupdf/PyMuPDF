name: test_sysinstall

on:
  schedule:
    - cron: '13 4 * * *'
  workflow_dispatch:

jobs:

  mupdf_release:
    name: mupdf_release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/setup-python@v5
      - uses: actions/checkout@v4
      - name: test_sysinstall
        run:
          python3 scripts/sysinstall.py -m 'git:-b 1.28.x'

  mupdf_master:
    name: mupdf_master
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/setup-python@v5
      - uses: actions/checkout@v4
      - name: test_sysinstall
        run:
          python3 scripts/sysinstall.py -m 'git:'
